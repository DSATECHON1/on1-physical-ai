name: ON1 Physical AI Simulator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  simulate:
    name: Run Virtual Robot Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Run ON1 Physical AI simulator
        run: python simulator/robot.py

      - name: Verify evidence artifact
        run: |
          test -f simulation_output/mission-result.json
          echo "Evidence artifact created successfully."
          echo "File size:"
          wc -c simulation_output/mission-result.json

      - name: Upload mission evidence
        uses: actions/upload-artifact@v4
        with:
          name: on1-physical-ai-mission-evidence
          path: simulation_output/mission-result.json
          if-no-files-found: error
