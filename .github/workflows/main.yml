name: ON1 Physical AI Prototype

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  backend-test:
    name: Run Backend Mission Engine
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run backend mission engine
        env:
          ON1_CI_TEST: "1"
        run: python backend/main.py

      - name: Verify backend evidence artifact
        run: |
          test -f backend_output/mission-result.json
          echo "Backend evidence artifact created successfully."
          echo "File size:"
          wc -c backend_output/mission-result.json

      - name: Upload backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: on1-physical-ai-backend-evidence
          path: backend_output/mission-result.json
          if-no-files-found: error


  simulator-test:
    name: Run Software Simulator
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Run ON1 Physical AI simulator
        run: python simulator/robot.py

      - name: Verify simulation evidence
        run: |
          test -f simulation_output/mission-result.json
          echo "Simulation evidence artifact created successfully."
          echo "File size:"
          wc -c simulation_output/mission-result.json

      - name: Upload simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: on1-physical-ai-simulation-evidence
          path: simulation_output/mission-result.json
          if-no-files-found: error


  api-test:
    name: Test ON1 Physical AI API
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run API self-test
        env:
          ON1_API_TEST: "1"
          ON1_CI_TEST: "1"
        run: python backend/api.py


  protocol-test:
    name: Test ON1 Protocol Miner → Validator Pipeline
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Run ON1 protocol integration test
        run: python -m unittest protocol.test_protocol -v

      - name: Confirm protocol test completed
        run: |
          echo "ON1 protocol integration test completed successfully."
          echo "Mission Request → Miner → Evidence → Validator → PoPW → SHA-256"
